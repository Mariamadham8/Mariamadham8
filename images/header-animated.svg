<?xml version="1.0" encoding="utf-8"?>
<svg width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="It's Meeee!">
  <style>
    
    text { font-family: Arial, Helvetica, sans-serif; font-size: 48px; font-weight: 700; fill: #800080; }
  </style>

  <rect width="100%" height="100%" fill="transparent" />

  <g id="letters" transform="translate(60,72)">

    <text x="0" y="0" opacity="0">I
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.12s" fill="freeze" />
    </text>

    <text x="28" y="0" opacity="0">t
      <animate attributeName="opacity" from="0" to="1" begin="0.12s" dur="0.12s" fill="freeze" />
    </text>

    <text x="52" y="0" opacity="0">' 
      <animate attributeName="opacity" from="0" to="1" begin="0.24s" dur="0.12s" fill="freeze" />
    </text>

    <text x="70" y="0" opacity="0">s
      <animate attributeName="opacity" from="0" to="1" begin="0.36s" dur="0.12s" fill="freeze" />
    </text>

    <text x="98" y="0" opacity="0">&nbsp;</text>

    <text x="120" y="0" opacity="0">M
      <animate attributeName="opacity" from="0" to="1" begin="0.48s" dur="0.12s" fill="freeze" />
    </text>

    <text x="154" y="0" opacity="0">e
      <animate attributeName="opacity" from="0" to="1" begin="0.60s" dur="0.12s" fill="freeze" />
    </text>

    <text x="178" y="0" opacity="0">e
      <animate attributeName="opacity" from="0" to="1" begin="0.72s" dur="0.12s" fill="freeze" />
    </text>

    <text x="202" y="0" opacity="0">e
      <animate attributeName="opacity" from="0" to="1" begin="0.84s" dur="0.12s" fill="freeze" />
    </text>

    <text x="226" y="0">!</text>
  
    <text x="226" y="0" opacity="0">!
      <animate attributeName="opacity" from="0" to="1" begin="0.96s" dur="0.12s" fill="freeze" />
      <animateTransform attributeName="transform" attributeType="XML"
        type="translate" from="0 -4" to="0 0" begin="0.96s" dur="0.18s" fill="freeze" />
    </text>
  </g>


  <g transform="translate(280,18)" opacity="0">
    <text font-size="28" fill="#ff66b2">✖️</text>
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.2s" fill="freeze" />
    <animateTransform attributeName="transform" attributeType="XML"
      type="scale" from="0.6" to="1" begin="1.2s" dur="0.25s" fill="freeze" />
  </g>

</svg>
